<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design idioms · fastWorkflow</title>
<script>
  // The page moved to one file per idiom. An old #e-file style link goes to that idiom's page;
  // an idiom merged into another page goes to its section there.
  (function () {
    var id = location.hash.slice(1);
    var merged = {
      "e-move": "e-object.html#e-move", "e-seeds": "e-purpose.html#e-seeds",
      "e-approval": "e-writes.html#e-approval", "p-named": "p-run.html#p-named",
      "p-pages": "p-run.html#p-pages", "p-model": "p-facts.html#p-model",
      "p-union": "p-facts.html#p-union", "s-union": "p-facts.html#s-union",
      "s-annotation": "p-facts.html#s-annotation", "p-verify": "e-words.html#p-verify",
      "s-field": "e-words.html#s-field", "p-split": "r-turn.html#p-split",
      "p-review": "r-turn.html#p-review", "c-global": "c-folder.html#c-global",
      "c-name": "c-folder.html#c-name", "c-node": "c-state.html#c-node",
      "s-subclass": "p-share.html#s-subclass", "s-class": "r-shapes.html#s-class",
      "s-docstring": "r-shapes.html#s-docstring", "s-property": "r-shapes.html#s-property",
      "shapes": "r-shapes.html"
    };
    var groups = ["execution", "planning", "contexts", "reference"];
    var target = "design_idioms/index.html";
    if (merged.hasOwnProperty(id)) target = "design_idioms/" + merged[id];
    else if (/^([epc]-[a-z]+|r-[a-z]+|removed)$/.test(id)) target = "design_idioms/" + id + ".html";
    else if (groups.indexOf(id) !== -1) target += "#" + id;
    location.replace(target);
  })();
</script>
</head>
<body>
<p>The design idioms are now one page each: <a href="design_idioms/index.html">design_idioms/index.html</a>.</p>
</body>
</html>
